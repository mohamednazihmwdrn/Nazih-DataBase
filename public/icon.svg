<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.25" />

  <!-- Database Cylinders / Core Server Layers -->
  <g transform="translate(136, 105)">
    <!-- Top Disc -->
    <ellipse cx="120" cy="45" rx="110" ry="32" fill="#1e293b" stroke="#38bdf8" stroke-width="6" />
    <ellipse cx="120" cy="45" rx="80" ry="22" fill="#0f172a" stroke="#06b6d4" stroke-width="3" />
    
    <!-- Middle Cylinder Layer -->
    <path d="M 10 45 L 10 115 A 110 32 0 0 0 230 115 L 230 45" fill="#1e293b" stroke="#38bdf8" stroke-width="6" />
    <path d="M 10 115 A 110 32 0 0 0 230 115" fill="none" stroke="#38bdf8" stroke-width="6" />
    
    <!-- Bottom Cylinder Layer -->
    <path d="M 10 115 L 10 185 A 110 32 0 0 0 230 185 L 230 115" fill="#1e293b" stroke="#38bdf8" stroke-width="6" />
    <path d="M 10 185 A 110 32 0 0 0 230 185" fill="none" stroke="#38bdf8" stroke-width="6" />

    <!-- Status Indicator LED Lights -->
    <circle cx="205" cy="50" r="7" fill="#10b981" filter="url(#glow)" />
    <circle cx="205" cy="120" r="7" fill="#06b6d4" filter="url(#glow)" />
    <circle cx="205" cy="190" r="7" fill="#3b82f6" filter="url(#glow)" />
  </g>

  <!-- Pulse Heartbeat Waveform Line (StorePulse Signature) -->
  <g filter="url(#glow)">
    <path d="M 64 360 L 170 360 L 205 310 L 245 420 L 285 280 L 320 380 L 345 360 L 448 360"
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Pulse Node Dots -->
  <circle cx="285" cy="280" r="9" fill="#ffffff" filter="url(#glow)" />
  <circle cx="245" cy="420" r="9" fill="#10b981" filter="url(#glow)" />
</svg>
